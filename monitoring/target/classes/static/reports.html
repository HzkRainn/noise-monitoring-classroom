<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reports - Noise Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
        <div class="logo">🎓 Noise Monitoring</div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">
                🏠 Home
            </a>
            <a href="dashboard.html" class="nav-btn">
                📊 Dashboard
            </a>
            <a href="reports.html" class="nav-btn active">
                📁 Reports
            </a>
        </div>
    </nav>

<h1 class="page-title">📁 Reports Center</h1>

<div class="cards" id="reportInfo"></div>

<div class="action-buttons">
    <button class="btn-primary" onclick="exportData()">📦 Export</button>
    <button class="btn-danger" onclick="exportAndClean()">🧹 Export & Clean</button>
</div>

<div class="table-card">
    <div class="table-card-header">
        <h2>📊 Latest 200 Sensor Readings</h2>
        <span id="reportsRefreshIndicator" class="refresh-indicator"></span>
        <div class="table-controls">
            <select id="classroomSelect">
                <option value="1">Classroom 1</option>
                <option value="2">Classroom 2</option>
            </select>
        </div>
    </div>

    <div class="loading" id="readingLoading">
    <div class="spinner"></div>
    </div>

    <table id="readingTable"></table>

</div>

<div class="table-card">
    <div class="table-card-header">
        <h2>🚨 Latest 100 Alarm Logs</h2>
    </div>

    <div class="loading" id="alarmLoading">
    <div class="spinner"></div>
    </div>

    <table id="alarmTable"></table>

</div>

<script src="report.js"></script>

</body>
</html>
